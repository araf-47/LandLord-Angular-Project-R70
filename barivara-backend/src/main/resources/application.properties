spring.application.name=barivara-backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/barivara_db
spring.datasource.username=Araf
spring.datasource.password=47araf47

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

landlord.backend.url=http://localhost:8080

# ---------------------------------------------------------------------------
# Auth (com.idb.auth, embedded). Own users/roles rows live in barivara_db --
# not shared with landlord-backend's copy. See Parts/auth/AUTH.md for the flow.
# ---------------------------------------------------------------------------
jwt.token.expiration.access=${JWT_ACCESS_TOKEN_EXPIRE_TIME:900000}
jwt.token.expiration.refresh=${JWT_REFRESH_TOKEN_EXPIRE_TIME:31536000000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:Content-Type,Authorization,x-access-token,x-refresh-token}

permissions.file.path=${PERMISSIONS_FILE_PATH:classpath:permissions.json}
file.base.path=${FILE_BASE_PATH:./}

# Seeded account: your own separate BariVara login for the landlord-linked
# dashboard. No relation to landlord-backend's own "landlord" account -- by
# design, no SSO between the two apps.
credentials.default.username=${CREDENTIALS_DEFAULT_USERNAME:landlord-linked}
credentials.default.password=${CREDENTIALS_DEFAULT_PASSWORD:Landlord@12345}
credentials.default.role=${CREDENTIALS_DEFAULT_ROLE:LANDLORD}
credentials.default.phone=${CREDENTIALS_DEFAULT_PHONE:+8801700000001}
credentials.default.email=${CREDENTIALS_DEFAULT_EMAIL:landlord@barivara.local}
credentials.default.two-factor-enabled=${CREDENTIALS_DEFAULT_2FA:false}

security.account-lockout.max-attempts=${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
security.account-lockout.duration-minutes=${ACCOUNT_LOCKOUT_DURATION_MINUTES:30}

auth.ip.block.enabled=${IP_BLOCKING_ENABLED:false}
auth.ip.block.max.failed.attempts=${IP_BLOCKING_MAX_FAILED_ATTEMPTS:50}
auth.ip.block.max.unauthenticated.attempts=${IP_BLOCKING_MAX_UNAUTHENTICATED_ATTEMPTS:15}
auth.ip.block.max.invalid.jwt.attempts=${IP_BLOCKING_MAX_INVALID_JWT_ATTEMPTS:15}
auth.ip.block.max.invalid.otp.attempts=${IP_BLOCKING_MAX_INVALID_OTP_ATTEMPTS:5}
auth.ip.block.block.duration.hours=${IP_BLOCKING_BLOCK_DURATION_HOURS:1440}

enable.cache=${ENABLE_CACHE:true}
cache.config.params={"user":{"ttlMinutes":900,"maxSize":2000,"recordStats":true}, \
                    "permissions":{"ttlMinutes":2880,"maxSize":500,"recordStats":true}, \
                    "otp":{"ttlMinutes":5,"maxSize":20000,"recordStats":true}, \
                    "otp-attempts":{"ttlMinutes":1440,"maxSize":20000,"recordStats":true}, \
                    "otp-resend-cooldown":{"ttlMinutes":1,"maxSize":20000,"recordStats":true}, \
                    "configuration":{"ttlMinutes":1440,"maxSize":100,"recordStats":true}}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Mail is a stub (LoggingMailService) unless mail.provider=brevo is set below.
mail.sink.enabled=${MAIL_SINK_ENABLED:false}
mail.sink.dir=${MAIL_SINK_DIR:./target/mail-sink}

# Real OTP email delivery via Brevo. LoggingMailService (console-only) stays
# the default until mail.provider=brevo is set - never on by accident.
mail.provider=${MAIL_PROVIDER:}
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:LandLord}
brevo.api.base-url=${BREVO_API_BASE_URL:https://api.brevo.com}
