<svg viewBox="0 0 620 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LandLord Core logo, badge style, reversed for dark backgrounds">
  <defs>
    <style>
      .main {
        font-family: 'Nunito', 'Century Gothic', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        fill: #F3F7FE;
      }
      .badge-text {
        font-family: 'Nunito', 'Century Gothic', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        fill: #0B1C36;
