<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BariVara.com logo, for dark backgrounds">
  <defs>
    <style>
      .word {
        font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        fill: #FBF3EA;
      }
      .tld {
        font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        fill: #FF8A3D;
      }
    </style>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF5C00"/>
    </linearGradient>
  </defs>

  <!-- Icon: unchanged from the light-background version. The orange badge
       and cream cutout already read clearly on dark surfaces. -->
  <g transform="translate(20,6)">
    <path d="M95 0
             C48 0 10 38 10 85
             C10 133 55 172 95 214
             C135 172 180 133 180 85
             C180 38 142 0 95 0 Z"
          fill="url(#badgeGrad)"/>

    <path d="M95 38
             L146 84
             L133 84
             L133 132
             L102 132
             L102 104
             L88 104
             L88 132
             L57 132
             L57 84
             L44 84 Z"
          fill="#FFF6EE"/>

    <rect x="87" y="110" width="16" height="22" rx="2" fill="url(#badgeGrad)"/>
  </g>

  <!-- Wordmark: the only change from the primary version is warm off-white
       instead of near-black. The near-black text was what broke on dark
       backgrounds, not the icon. -->
  <text x="230" y="128" class="word" font-size="72">BariVara</text>
  <text x="230" y="162" class="tld" font-size="26" letter-spacing="1">.com</text>
</svg>
