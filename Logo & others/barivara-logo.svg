<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BariVara.com logo">
  <defs>
    <style>
      .word {
        font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        fill: #241B12;
      }
      .tld {
        font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        fill: #FF6A1A;
      }
    </style>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF5C00"/>
    </linearGradient>
  </defs>

  <!-- Icon: map-pin plus house, the visual grammar for "rental listing",
       rendered as a white cutout so it stays legible down to favicon size -->
  <g transform="translate(20,6)">
    <!-- true teardrop pin: rounded top tapering to a single point, the
         universal "location / listing" glyph -->
    <path d="M95 0
             C48 0 10 38 10 85
             C10 133 55 172 95 214
             C135 172 180 133 180 85
             C180 38 142 0 95 0 Z"
          fill="url(#badgeGrad)"/>

    <!-- house silhouette, negative-space cutout, sits inside the pin's head -->
    <path d="M95 38
             L146 84
             L133 84
             L133 132
             L102 132
             L102 104
             L88 104
             L88 132
             L57 132
             L57 84
             L44 84 Z"
          fill="#FFF6EE"/>

    <!-- door cutout: reinforces "access / a place of your own" -->
    <rect x="87" y="110" width="16" height="22" rx="2" fill="url(#badgeGrad)"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="128" class="word" font-size="72">BariVara</text>
  <text x="230" y="162" class="tld" font-size="26" letter-spacing="1">.com</text>
</svg>
