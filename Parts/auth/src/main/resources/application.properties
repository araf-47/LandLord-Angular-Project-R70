spring.application.name=auth

# ---------------------------------------------------------------------------
# Datasource - PostgreSQL. The permission queries use PostgreSQL-specific SQL
# (STRING_AGG), so H2 is not a drop-in substitute.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---------------------------------------------------------------------------
# JWT. Access/refresh lifetimes in milliseconds. There is no global signing
# secret: each token is signed with the owning user's stored password hash.
# ---------------------------------------------------------------------------
jwt.token.expiration.access=${JWT_ACCESS_TOKEN_EXPIRE_TIME:900000}
jwt.token.expiration.refresh=${JWT_REFRESH_TOKEN_EXPIRE_TIME:31536000000}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:Content-Type,Authorization,x-access-token,x-refresh-token}

# ---------------------------------------------------------------------------
# Authorization matrix. Loaded once at startup; re-imported only when the
# version in the file is greater than the one recorded in `configurations`.
# ---------------------------------------------------------------------------
permissions.file.path=${PERMISSIONS_FILE_PATH:classpath:permissions.json}
file.base.path=${FILE_BASE_PATH:./}

# ---------------------------------------------------------------------------
# Seeded administrator
# ---------------------------------------------------------------------------
credentials.default.username=${CREDENTIALS_DEFAULT_USERNAME:admin}
credentials.default.password=${CREDENTIALS_DEFAULT_PASSWORD:Admin@12345}
credentials.default.role=${CREDENTIALS_DEFAULT_ROLE:ADMIN}
credentials.default.phone=${CREDENTIALS_DEFAULT_PHONE:+8801717171717}
credentials.default.email=${CREDENTIALS_DEFAULT_EMAIL:admin@idb.local}
credentials.default.two-factor-enabled=${CREDENTIALS_DEFAULT_2FA:false}

# ---------------------------------------------------------------------------
# Per-account lockout
# ---------------------------------------------------------------------------
security.account-lockout.max-attempts=${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
security.account-lockout.duration-minutes=${ACCOUNT_LOCKOUT_DURATION_MINUTES:30}

# ---------------------------------------------------------------------------
# Per-IP blocking. Disabled by default: enabling it swaps NoOpIpBlockingService
# for the persistent implementation and activates IpBlockingFilter.
# ---------------------------------------------------------------------------
auth.ip.block.enabled=${IP_BLOCKING_ENABLED:false}
auth.ip.block.max.failed.attempts=${IP_BLOCKING_MAX_FAILED_ATTEMPTS:50}
auth.ip.block.max.unauthenticated.attempts=${IP_BLOCKING_MAX_UNAUTHENTICATED_ATTEMPTS:15}
auth.ip.block.max.invalid.jwt.attempts=${IP_BLOCKING_MAX_INVALID_JWT_ATTEMPTS:15}
auth.ip.block.max.invalid.otp.attempts=${IP_BLOCKING_MAX_INVALID_OTP_ATTEMPTS:5}
auth.ip.block.block.duration.hours=${IP_BLOCKING_BLOCK_DURATION_HOURS:1440}

# ---------------------------------------------------------------------------
# Caches. The `otp` TTL IS the OTP expiry, and `otp-attempts` TTL is the
# rate-limit window - both are correctness-relevant, not just performance.
# ---------------------------------------------------------------------------
enable.cache=${ENABLE_CACHE:true}
cache.config.params={"user":{"ttlMinutes":900,"maxSize":2000,"recordStats":true}, \
                    "permissions":{"ttlMinutes":2880,"maxSize":500,"recordStats":true}, \
                    "otp":{"ttlMinutes":5,"maxSize":20000,"recordStats":true}, \
                    "otp-attempts":{"ttlMinutes":1440,"maxSize":20000,"recordStats":true}, \
                    "otp-resend-cooldown":{"ttlMinutes":1,"maxSize":20000,"recordStats":true}, \
                    "configuration":{"ttlMinutes":1440,"maxSize":100,"recordStats":true}}

# ---------------------------------------------------------------------------
# Actuator. Only health is exposed, and it is the single non-auth public URL
# (see CommonConstants.PUBLIC_URLS) so a load balancer can probe the service.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Development mail catcher. When enabled, FileMailSink replaces the default
# sender and writes each mail - OTP included - as JSON under mail.sink.dir so a
# black-box API test can read the code. NEVER enable outside local/CI: it puts
# one-time passwords on disk in plaintext.
# ---------------------------------------------------------------------------
mail.sink.enabled=${MAIL_SINK_ENABLED:false}
mail.sink.dir=${MAIL_SINK_DIR:./target/mail-sink}

# ---------------------------------------------------------------------------
# Real OTP email delivery via Brevo. LoggingMailService (console-only) stays
# the default until mail.provider=brevo is set - never on by accident.
# ---------------------------------------------------------------------------
mail.provider=${MAIL_PROVIDER:}
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:LandLord}
brevo.api.base-url=${BREVO_API_BASE_URL:https://api.brevo.com}
