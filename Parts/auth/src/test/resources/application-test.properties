# ============================================================
# Integration-test profile.
#
# The datasource is NOT set here - AbstractIntegrationTest injects it from the
# Testcontainers PostgreSQL instance via @DynamicPropertySource.
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# Caching must be on: the OTP cache TTL is what enforces OTP expiry, and the
# otp-attempts TTL is the rate-limit window.
enable.cache=true

# IP blocking is stateful across tests and would make them order-dependent.
# IpBlockingIT switches it on for its own context.
auth.ip.block.enabled=false

# Deterministic lockout thresholds.
security.account-lockout.max-attempts=5
security.account-lockout.duration-minutes=30

jwt.token.expiration.access=900000
jwt.token.expiration.refresh=31536000000

credentials.default.username=admin
credentials.default.password=Admin@12345
credentials.default.role=ADMIN
credentials.default.phone=+8801700000000
credentials.default.email=admin@test.local
credentials.default.two-factor-enabled=false

permissions.file.path=classpath:permissions.json
file.base.path=./target/test-storage/

logging.level.root=WARN
logging.level.com.idb=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.testcontainers=WARN
